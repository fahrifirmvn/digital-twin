[project]
name = "lactos-engine"
version = "0.1.0"
description = "LactaTwin engine service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "simpy>=4.1.2",
    "httpx>=0.28.1",
    "ortools>=9.15.6755",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "scikit-learn==1.9.1",
    "joblib>=1.5",
    "pandas>=3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
