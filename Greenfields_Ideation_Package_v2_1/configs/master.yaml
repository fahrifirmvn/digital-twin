# LactaTwin Master Configuration
# Single Source of Truth for plant configuration and simulation/optimization parameters
# Label: DATA SINTETIS
# Partner: [Nama Pabrik]

metadata:
  plant_name: "[Nama Pabrik]"
  data_classification: "DATA SINTETIS"
  version: "1.0.0"
  description: "Master parameter registry for raw milk receiving, processing, and filling scheduling."

plant_global:
  milk_density_kg_per_l: 1.0
  business_day_start: "06:00"
  business_day_end: "06:00" # Next day
  horizon_minutes: 1440
  carryover_minutes: 360 # 6 hours lookahead
  volume_unit_l: 100 # Discretization unit for CP-SAT volume balance

receiving:
  n_bays: 4 # UB-01, UB-02, UB-03, UB-04
  bays: ["UB-01", "UB-02", "UB-03", "UB-04"]
  tankers_active_per_bay: 1
  bay_flow_lph:
    value: 25000.0
    placeholder: true
    unit: "L/hour"
    description: "Nominal unloading flow rate per receiving bay pump"
  bay_cip_min:
    value: 45
    placeholder: true
    unit: "minutes"
    description: "CIP duration required for bay header and unloading manifold"
  slot_tolerance_min:
    value: 30
    placeholder: true
    unit: "minutes"
    description: "Allowable early/late deviation window from scheduled receiving slot"
  tanker_volume_distribution:
    distribution: "normal"
    min_l: 8000
    max_l: 12000
    mean_l: 10000
    std_l: 800
    placeholder: true
    description: "Tanker arrival volume distribution"

lab:
  n_channels: 2
  channels: ["LAB-CH-01", "LAB-CH-02"]
  placeholder: true
  default_duration_min:
    value: 20
    placeholder: true
    unit: "minutes"
    description: "Standard rapid testing duration (antibiotics, fat, protein, organoleptic)"
  qc_pass_rate_default:
    value: 0.96
    placeholder: true
    description: "Nominal QC release probability across candidate farms (95-98% range)"

degassing:
  units: ["DG-01", "DG-02"]
  is_bottleneck: false
  process_speed_lph:
    value: 35000.0
    placeholder: true

raw_milk_buffer_tanks:
  units: ["RMT-01", "RMT-02", "RMT-03"]
  capacity_l:
    value: 50000.0
    placeholder: true
  input_flow_lph:
    value: 30000.0
    placeholder: true
  output_flow_lph:
