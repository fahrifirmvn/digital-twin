plant_derating:
  utilisation_pct: 0.95
  placeholder: true
  description: "Nominal operational availability derating factor across lines"

maintenance_windows:
  windows:
    - id: "MAINT-FL01-WEEKLY"
      asset_id: "FL-01"
      start_minute: 720 # 18:00
      duration_min: 180
      day_of_week: 3
      placeholder: true
    - id: "MAINT-TH01-BIWEEKLY"
      asset_id: "TH-01"
      start_minute: 360 # 12:00
      duration_min: 240
      day_of_week: 5
      placeholder: true

sku_master:
  skus:
    - id: "ESL-FC"
      name: "ESL Full Cream"
      family: "ESL"
      flavour: "Full Cream"
      milk_usage_factor: 1.0
      allowed_sizes: ["LARGE_B", "LARGE_A", "ESL_320"]
    - id: "ESL-CH"
      name: "ESL Chocolate"
      family: "ESL"
      flavour: "Chocolate"
      milk_usage_factor: 0.9
      allowed_sizes: ["LARGE_B", "LARGE_A", "ESL_320"]
    - id: "ESL-ST"
      name: "ESL Strawberry"
      family: "ESL"
      flavour: "Strawberry"
      milk_usage_factor: 0.9
      allowed_sizes: ["LARGE_B", "LARGE_A"]
    - id: "UHT-FC"
      name: "UHT Full Cream"
      family: "UHT"
      flavour: "Full Cream"
      milk_usage_factor: 1.0
      allowed_sizes: ["LARGE_B", "LARGE_A", "SMALL_A", "SMALL_B"]
    - id: "UHT-CH"
      name: "UHT Chocolate"
      family: "UHT"
      flavour: "Chocolate"
      milk_usage_factor: 0.9
      allowed_sizes: ["LARGE_B", "LARGE_A", "SMALL_A", "SMALL_B"]
    - id: "UHT-ST"
      name: "UHT Strawberry"
      family: "UHT"
      flavour: "Strawberry"
      milk_usage_factor: 0.9
      allowed_sizes: ["LARGE_B", "LARGE_A", "SMALL_A", "SMALL_B"]
    - id: "UHT-WC"
      name: "UHT Whipping Cream"
      family: "UHT"
      flavour: "WC"
      milk_usage_factor: 0.9
      allowed_sizes: ["LARGE_A"]
    - id: "UHT-SK"
      name: "UHT Skim"
      family: "UHT Skim"
      flavour: "Skim"
      milk_usage_factor: 1.0
      allowed_sizes: ["LARGE_A"]

pack_sizes:
  LARGE_A: 1000
  LARGE_B: 950
  ESL_320: 320
  SMALL_A: 250
  SMALL_B: 200

changeover_rules:
  hierarchy: ["VARIANT", "SIZE", "PAPER", "NONE"]
  precedence_rules:
    VARIANT:
      condition: "Flavour_variant_changes"
      duration_minutes: 90
      placeholder: true
      overrides: ["SIZE", "PAPER"]
      cip_independent: true
    SIZE:
      condition: "Same_flavour_different_size_any_market"
      duration_minutes: 60
      placeholder: true
      overrides: ["PAPER"]
      cip_independent: true
    PAPER:
      condition: "Different_market_variant_same_size_same_flavour"
      duration_minutes: 20
      placeholder: true
      overrides: []
      cip_independent: true
    NONE:
      condition: "Same_market_variant_same_size_same_flavour"
      duration_minutes: 0
      placeholder: false

cip_triggers:
  flavour_change:
    condition: "Chocolate_or_Strawberry_to_Full_Cream"
    duration_min: 60
    placeholder: true
  flavour_cross:
    condition: "Chocolate_to_Strawberry_or_reverse"
    duration_min: 60
    placeholder: true
  end_production:
    condition: "End_Production_Campaign"
    duration_min: 90
    placeholder: true
  end_storage_volume:
    condition: "Empty_Tank_Before_Refill"
    duration_min: 75
    placeholder: true

optimizer:
  max_time_in_seconds: 10
  random_seed: 42
  num_workers: 1
  weights:
    w_waiting_p80: 10.0
    w_cip_count: 50.0
    w_schedule_deviation: 5.0
    w_unfulfilled_order: 1000.0
    w_order_lateness: 20.0
    w_changeover_count: 15.0
